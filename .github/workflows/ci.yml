name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Build (Vite)
        run: npm run build
      # Provas das regras que decidem se um lançamento nasce ou é reaproveitado.
      # Foi uma delas que pegou o valor comparado em float deixando passar um
      # centavo de diferença — lint e build não veriam isso.
      - name: Provas das regras
        run: npm run provas
