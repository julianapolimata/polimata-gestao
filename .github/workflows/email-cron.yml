name: Email Cron — Polímata Gestão

on:
  schedule:
    # A cada 15 minutos. A janela de 365 dias faz o robô descer o histórico
    # sozinho, 8 documentos por rodada (o que cabe no tempo da função); o que
    # já foi lido fica etiquetado no Gmail e não volta.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Acionamento manual. O "reprocessar" existe para recuperar e-mails que
    # ficaram para trás — por exemplo quando o serviço de leitura esteve fora.
    # Ele ignora a etiqueta e relê os e-mails marcados como falhos, repetindo
    # até acabar a lista (cada chamada lê um lote pequeno).
    inputs:
      reprocess:
        description: 'Reler os e-mails que ficaram para trás (em vez de procurar e-mails novos)'
        type: boolean
        default: false
      days:
        description: 'Quantos dias para trás procurar'
        default: '365'
      max:
        description: 'Quantos e-mails por rodada (máximo 10)'
        default: '8'

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Acionar /api/email-cron na Vercel
        env:
          DAYS: ${{ inputs.days || '365' }}
          MAX: ${{ inputs.max || '8' }}
          REPROCESS: ${{ inputs.reprocess && '1' || '0' }}
        run: |
          url="https://polimata-gestao.vercel.app/api/email-cron?days=${DAYS}&max=${MAX}"
          rodadas=1
          if [ "$REPROCESS" = "1" ]; then
            url="${url}&reprocess=1"
            # Cada chamada relê um lote; repete até a lista acabar ou o tempo
            # terminar, para não exigir um clique por lote.
            rodadas=20
            echo "Modo: RELENDO os e-mails que ficaram para trás"
          else
            echo "Modo: procurando e-mails novos"
          fi

          inicio=$(date +%s)
          falhas=0
          for i in $(seq 1 $rodadas); do
            echo "--- rodada $i"
            response=$(curl -sS -X POST "$url" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              -w "\n---HTTP_CODE---\n%{http_code}" \
              --max-time 310)
            status=$(echo "$response" | sed -n '/---HTTP_CODE---/{n;p}')
            body=$(echo "$response" | sed '/---HTTP_CODE---/,$d')
            echo "Status: $status"
            echo "Body: $body"
            if [ "$status" -ge 400 ] || [ -z "$status" ]; then
              # Numa releitura longa, uma rodada que estoura o tempo do servidor
              # não é motivo para abandonar as outras: o lote seguinte continua
              # de onde parou. Três seguidas, aí sim é problema de verdade.
              if [ "$rodadas" -eq 1 ]; then
                echo "::error::Cron falhou com HTTP $status"
                exit 1
              fi
              falhas=$((falhas + 1))
              echo "::warning::Rodada $i falhou com HTTP $status — seguindo para a próxima"
              if [ "$falhas" -ge 3 ]; then
                echo "::error::Três rodadas seguidas falharam"
                exit 1
              fi
              continue
            fi
            falhas=0
            [ "$rodadas" -eq 1 ] && break
            encontrados=$(echo "$body" | grep -o '"found":[0-9]*' | head -1 | cut -d: -f2)
            if [ "${encontrados:-0}" -eq 0 ]; then
              echo "Não sobrou e-mail para reler — terminando."
              break
            fi
            if [ $(( $(date +%s) - inicio )) -gt 900 ]; then
              echo "::warning::Tempo da rodada esgotado; o que faltou entra na próxima execução."
              break
            fi
          done
